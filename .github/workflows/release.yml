name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^ \* Version: *${version}$" embed-drive.php || { echo "Plugin header version differs from tag"; exit 1; }
          grep -q "define( 'EMBED_DRIVE_VERSION', '${version}' );" embed-drive.php || { echo "EMBED_DRIVE_VERSION differs from tag"; exit 1; }
          grep -q "^Stable tag: ${version}$" readme.txt || { echo "readme.txt Stable tag differs from tag"; exit 1; }

      - name: Build the plugin ZIP
        run: bin/build-zip.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/embed-drive.zip --title "Embed Drive ${GITHUB_REF_NAME#v}" --generate-notes
