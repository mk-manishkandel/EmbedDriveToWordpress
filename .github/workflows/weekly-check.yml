name: Weekly check

# Finds problems nothing else would: new flaws in the bundled preview libraries, which Dependabot
# can't see because they aren't listed as dependencies, and new WordPress or PHP versions breaking
# the plugin. A failed run emails the repository owner.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Check bundled libraries for known flaws
        run: node bin/check-libs.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tests:
    uses: ./.github/workflows/ci.yml
