<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https: http:; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; base-uri 'none'">
<title>Preview</title>
<style>
html, body { margin: 0; min-height: 100%; background: #2a2d33; font: 14px/1.4 system-ui, sans-serif; }
#pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }
.page { display: block; width: 100%; max-width: 980px; background: #fff; box-shadow: 0 1px 8px rgba(0, 0, 0, .4); }
.docx-wrapper { padding: 12px !important; background: transparent !important; }
.docx-wrapper > section.docx { min-width: min(816px, 100%); min-height: 300px; padding: 48px; box-sizing: border-box; max-width: 100%; box-shadow: 0 1px 8px rgba(0, 0, 0, .4) !important; margin-bottom: 12px !important; overflow-x: auto; }
#tabs { position: sticky; top: 0; display: flex; gap: 4px; padding: 8px 12px; overflow-x: auto; background: #2a2d33; }
#tabs button { padding: 5px 12px; color: #fff; white-space: nowrap; cursor: pointer; background: rgba(255, 255, 255, .12); border: 0; border-radius: 6px; font: inherit; }
#tabs button[aria-pressed="true"] { color: #23262b; background: #fff; }
#sheet { margin: 0 12px 12px; overflow: auto; background: #fff; }
table { border-collapse: collapse; color: #23262b; }
td { padding: 4px 8px; white-space: nowrap; border: 1px solid #dfe1e5; }
#note { padding: 8px 12px; color: #fff; opacity: .7; }
</style>
</head>
<body>
<div id="root"></div>
<script src="viewer.js"></script>
</body>
</html>
